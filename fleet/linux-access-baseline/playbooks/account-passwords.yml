---
- name: Set the root and operator account passwords
  hosts: "{{ target | default('automation_account_targets:automation_account_key_only') }}"
  gather_facts: true
  become: true
  become_user: root
  serial: 1
  strategy: linear
  any_errors_fatal: true
  vars_files:
    - ../config.example.yml
  vars:
    root_password: "{{ vault_root_password | default(lookup('ansible.builtin.env', root_password_env))\
      \ }}"
    operator_password: >-
      {{ vault_operator_password | default(lookup('ansible.builtin.env', operator_password_env)) }}
  pre_tasks:
    - name: Check configuration and access boundaries
      ansible.builtin.import_tasks: tasks/preflight.yml
  tasks:
    - name: Require both credentials before touching any account
      ansible.builtin.assert:
        that:
          - root_password | length > 0
          - operator_password | length > 0
        fail_msg: >-
          Supply both passwords through the named environment variables or encrypted Vault variables.
          Empty credentials are refused.
        quiet: true
      no_log: true
    - name: Read the account and group databases
      ansible.builtin.getent:
        database: "{{ item }}"
      loop:
        - passwd
        - group
    - name: Decide which group grants administrative rights here
      ansible.builtin.set_fact:
        operator_admin_group: "{{ 'sudo' if 'sudo' in ansible_facts.getent_group else 'wheel' }}"
    - name: Confirm this host has an administrative group to put operator in
      ansible.builtin.assert:
        that:
          - operator_admin_group in ansible_facts.getent_group
        fail_msg: >-
          {{ inventory_hostname }} has neither a sudo nor a wheel group, so there is no group membership
          to grant operator.
        quiet: true
    - name: Set the root password
      ansible.builtin.user:
        name: root
        password: "{{ root_password | password_hash('sha512') }}"
        update_password: always
      no_log: true
    - name: Create the operator account where it does not exist
      when: operator_user not in ansible_facts.getent_passwd
      ansible.builtin.user:
        name: "{{ operator_user }}"
        shell: /bin/bash
        home: "{{ operator_home }}"
        create_home: true
        groups: "{{ operator_admin_group }}"
        append: true
        password: "{{ operator_password | password_hash('sha512') }}"
        update_password: always
        state: present
      no_log: true
    - name: Set the operator password where the account already exists
      when: operator_user in ansible_facts.getent_passwd
      ansible.builtin.user:
        name: "{{ operator_user }}"
        password: "{{ operator_password | password_hash('sha512') }}"
        update_password: always
      no_log: true
    - name: Read back the root password status
      ansible.builtin.command:
        argv:
          - passwd
          - -S
          - root
      register: root_passwd_status
      changed_when: false
      check_mode: false
    - name: Confirm root now has a usable password
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - root_passwd_status.stdout.split() | length > 1
          - root_passwd_status.stdout.split()[1] is match('^P')
        fail_msg: >-
          {{ inventory_hostname }}: root still reports {{ root_passwd_status.stdout.split()[1] | default('unreadable')
          }} rather than a usable password. sudoers-rootpw.yml must not run against this host: Defaults
          rootpw with a locked root password locks every account out of sudo here.
        quiet: true
    - name: Read back the operator account's groups
      when: not ansible_check_mode
      ansible.builtin.command:
        argv:
          - id
          - -nG
          - "{{ operator_user }}"
      register: operator_groups
      changed_when: false
      check_mode: false
      failed_when: false
    - name: Confirm operator exists and holds administrative group membership
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - operator_groups.rc == 0
          - operator_admin_group in operator_groups.stdout.split()
        fail_msg: >-
          {{ inventory_hostname }}: operator is missing or is not in {{ operator_admin_group }}. Groups
          read back: {{ operator_groups.stdout | default('none') }}.
        quiet: true
    - name: Prove the root password authenticates
      when: not ansible_check_mode
      become: true
      become_method: ansible.builtin.su
      become_user: root
      vars:
        ansible_become_password: "{{ root_password }}"
      ansible.builtin.raw: id -un
      register: root_auth
      changed_when: false
      failed_when: false
      no_log: true
    - name: Confirm root authenticated
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - root_auth.rc | default(1) == 0
          - '''root'' in (root_auth.stdout_lines | default([]))'
        fail_msg: >-
          {{ inventory_hostname }}: su to root did not authenticate with the supplied password. The hash
          may have landed but the value is wrong. Do not run sudoers-rootpw.yml against this host.
        quiet: true
    - name: Prove the operator password authenticates
      when: not ansible_check_mode
      become: true
      become_method: ansible.builtin.su
      become_user: "{{ operator_user }}"
      vars:
        ansible_become_password: "{{ operator_password }}"
      ansible.builtin.raw: id -un
      register: operator_auth
      changed_when: false
      failed_when: false
      no_log: true
    - name: Confirm operator authenticated
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - operator_auth.rc | default(1) == 0
          - operator_user in (operator_auth.stdout_lines | default([]))
        fail_msg: >-
          {{ inventory_hostname }}: su to {{ operator_user }} did not authenticate with the supplied password.
        quiet: true
    - name: Confirm the connection account still holds passwordless sudo
      when: not ansible_check_mode
      become: false
      ansible.builtin.command:
        argv:
          - sudo
          - -k
          - -n
          - 'true'
      changed_when: false
    - name: Report the per-host result
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: root={{ root_passwd_status.stdout.split()[1] | default('unknown')
          }} root_auth={{ 'ok' if (root_auth.stdout | default('') is search('root')) else 'not tested'
          }} operator_groups={{ operator_groups.stdout | default('unknown') }} operator_auth={{ 'ok' if
          (operator_auth.stdout | default('') is search(operator_user)) else 'not tested' }}
