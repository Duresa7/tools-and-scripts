---
- name: Install and enable node_exporter on approved hosts
  hosts: '{{ target | default(''node_exporter_targets'') }}'
  gather_facts: true
  become: true
  serial: 1
  vars:
    node_exporter_version: '{{ (monitoring | default({})).node_exporter_version | default(''1.9.0'') }}'
    node_exporter_apt_version: '{{ (monitoring | default({})).node_exporter_apt_version | default(''1.9.0-1+b4'') }}'
    node_exporter_port: '{{ (monitoring | default({})).node_exporter_port | default(9100) }}'
    node_exporter_listen_address: '{{ (monitoring | default({})).node_exporter_listen_address | default(''127.0.0.1:'' ~ node_exporter_port)
      }}'
    node_exporter_probe_host: '{{ (monitoring | default({})).node_exporter_probe_host | default(''127.0.0.1'') }}'
    node_exporter_binary: '{{ (monitoring | default({})).node_exporter_binary | default(''/usr/local/bin/node_exporter'')
      }}'
    node_exporter_service_user: '{{ (monitoring | default({})).node_exporter_service_user | default(''node_exporter'') }}'
    node_exporter_unit_dir: '{{ (monitoring | default({})).node_exporter_unit_dir | default(''/etc/systemd/system'') }}'
    node_exporter_arch: '{{ (monitoring | default({})).node_exporter_arch | default(''amd64'') }}'
    node_exporter_manage_firewall: '{{ (monitoring | default({})).node_exporter_manage_firewall | default(false) }}'
  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: l
  pre_tasks:
    - name: Require approved inventory membership
      ansible.builtin.assert:
        that:
          - inventory_hostname in groups.get('node_exporter_targets', [])
          - groups.get('node_exporter_targets', []) | sort == (monitoring_scope | default({})).get('node_exporter_targets',
            []) | sort
        fail_msg: Target scope differs from the reviewed monitoring_scope allowlist.
        quiet: true
    - name: Require explicit consent for live changes
      ansible.builtin.assert:
        that:
          - ansible_check_mode or monitoring_confirmation | default('') == 'APPLY monitoring exporters'
        fail_msg: Use --check to preview or supply the documented confirmation phrase.
        quiet: true
    - name: Describe the check mode boundary
      ansible.builtin.debug:
        msg: 'Preview only: approved host and configuration checked. Downloads, writes, restarts, and live verification require
          an apply run.'
      when: ansible_check_mode
    - name: Finish preview before changing the target
      ansible.builtin.meta: end_host
      when: ansible_check_mode
  tasks:
    - name: Confirm a supported package manager is present
      ansible.builtin.assert:
        that:
          - ansible_facts.pkg_mgr in ['apt', 'dnf', 'dnf5']
        fail_msg: Unsupported package manager '{{ ansible_facts.pkg_mgr }}' on {{ inventory_hostname }}.
        quiet: true
    - name: Gather installed package facts
      ansible.builtin.package_facts: null
    - name: Gather service facts
      ansible.builtin.service_facts: null
    - name: Refresh the apt cache before reading the candidate version
      when: ansible_facts.pkg_mgr == 'apt'
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
    - name: Read the apt candidate version
      when: ansible_facts.pkg_mgr == 'apt'
      changed_when: false
      check_mode: false
      ansible.builtin.shell:
        cmd: |-
          set -o pipefail
          apt-cache policy prometheus-node-exporter | awk '/Candidate:/ {print $2}'
        executable: /bin/bash
      register: apt_candidate
    - name: Decide the install method for this host
      ansible.builtin.set_fact:
        install_method: |-
          {{ 'apt'
             if (ansible_facts.pkg_mgr == 'apt'
                 and (apt_candidate.stdout | default('') | trim) == node_exporter_apt_version)
             else 'binary' }}
    - name: Refuse competing package and upstream service ownership
      ansible.builtin.assert:
        that:
          - not (install_method == 'apt' and 'node_exporter.service' in ansible_facts.services)
          - not (install_method == 'binary' and 'prometheus-node-exporter' in ansible_facts.packages)
          - install_method != 'binary' or ansible_facts.architecture == 'x86_64' and node_exporter_arch == 'amd64'
        fail_msg: Review conflicting install methods or unsupported binary architecture before proceeding.
        quiet: true
    - name: Record whether something already answers on the exporter port
      become: false
      check_mode: false
      changed_when: false
      failed_when: false
      ansible.builtin.command:
        argv:
          - curl
          - -s
          - -o
          - /dev/null
          - -w
          - '%{http_code}'
          - -m
          - '4'
          - http://{{ node_exporter_probe_host }}:{{ node_exporter_port }}/metrics
      register: pre_existing_exporter
    - name: Fail when an unmanaged exporter already owns the port
      when:
        - (pre_existing_exporter.stdout | default('000')) == '200'
        - '''prometheus-node-exporter'' not in ansible_facts.packages'
        - '''node_exporter.service'' not in ansible_facts.services'
      ansible.builtin.assert:
        that:
          - allow_port_takeover | default(false) | bool
        fail_msg: '{{ inventory_hostname }} already serves metrics on {{ node_exporter_port }} but has neither the Debian
          package nor a managed node_exporter.service. Inspect it, then re-run with -e allow_port_takeover=true to proceed.'
        quiet: true
    - name: Install the pinned Debian node_exporter package
      when: install_method == 'apt'
      ansible.builtin.apt:
        name: prometheus-node-exporter={{ node_exporter_apt_version }}
        state: present
        install_recommends: false
      register: apt_install
      notify: Restart the Debian exporter
    - name: Configure the packaged exporter listener
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus-node-exporter
        regexp: ^ARGS=
        line: ARGS="--web.listen-address={{ node_exporter_listen_address }}"
        create: false
      when: install_method == 'apt'
      notify: Restart the Debian exporter
    - name: Enable and start the Debian exporter service
      when: install_method == 'apt'
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        enabled: true
        state: started
    - name: Create the node_exporter system account
      when: install_method == 'binary'
      ansible.builtin.user:
        name: '{{ node_exporter_service_user }}'
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        home: /nonexistent
    - name: Download, unpack, and install upstream node_exporter release
      when: install_method == 'binary'
      block:
        - name: Create temporary staging directory for the node_exporter archive
          ansible.builtin.tempfile:
            state: directory
            prefix: node_exporter.
          register: node_exporter_staging_dir

        - name: Ensure the staging directory is owned by root with mode 0700
          ansible.builtin.file:
            path: '{{ node_exporter_staging_dir.path }}'
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: Download the upstream node_exporter release
          ansible.builtin.get_url:
            url: >-
              https://github.com/prometheus/node_exporter/releases/download/v{{
              node_exporter_version }}/node_exporter-{{ node_exporter_version
              }}.linux-{{ node_exporter_arch }}.tar.gz
            dest: "{{ node_exporter_staging_dir.path }}/node_exporter.tar.gz"
            checksum: >-
              sha256:https://github.com/prometheus/node_exporter/releases/download/v{{
              node_exporter_version }}/sha256sums.txt
            mode: '0640'
            owner: root
            group: root

        - name: Unpack the release into the staging directory
          ansible.builtin.unarchive:
            src: "{{ node_exporter_staging_dir.path }}/node_exporter.tar.gz"
            dest: "{{ node_exporter_staging_dir.path }}"
            remote_src: true

        - name: Install the binary
          ansible.builtin.copy:
            src: >-
              {{ node_exporter_staging_dir.path }}/node_exporter-{{
              node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter
            dest: '{{ node_exporter_binary }}'
            remote_src: true
            owner: root
            group: root
            mode: '0755'
          notify: Restart the upstream exporter
      always:
        - name: Remove the temporary staging directory
          ansible.builtin.file:
            path: '{{ node_exporter_staging_dir.path }}'
            state: absent
          when: node_exporter_staging_dir.path is defined
    - name: Install the systemd unit
      when: install_method == 'binary'
      ansible.builtin.copy:
        dest: '{{ node_exporter_unit_dir }}/node_exporter.service'
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Documentation=https://github.com/prometheus/node_exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User={{ node_exporter_service_user }}
          Group={{ node_exporter_service_user }}
          Type=simple
          ExecStart={{ node_exporter_binary }} --web.listen-address={{ node_exporter_listen_address }}
          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=true
          ProtectHome=true
          ProtectSystem=strict
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
      notify: Restart the upstream exporter
    - name: Enable and start the upstream exporter service
      when: install_method == 'binary'
      ansible.builtin.systemd_service:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true
    - name: Read the active firewalld port rule
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --query-port
          - '{{ node_exporter_port }}/tcp'
      register: firewall_runtime
      changed_when: false
      failed_when: firewall_runtime.rc not in [0, 1]
      when: &id001
        - ansible_facts.os_family == 'RedHat'
        - '''firewalld.service'' in ansible_facts.services'
        - (ansible_facts.services['firewalld.service'].state | default('stopped')) == 'running'
        - node_exporter_manage_firewall | bool
    - name: Read the persistent firewalld port rule
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --query-port
          - '{{ node_exporter_port }}/tcp'
      register: firewall_persistent
      changed_when: false
      failed_when: firewall_persistent.rc not in [0, 1]
      when: *id001
    - name: Enable the runtime firewalld port rule
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --add-port
          - '{{ node_exporter_port }}/tcp'
      when:
        - ansible_facts.os_family == 'RedHat'
        - '''firewalld.service'' in ansible_facts.services'
        - (ansible_facts.services['firewalld.service'].state | default('stopped')) == 'running'
        - node_exporter_manage_firewall | bool
        - firewall_runtime.rc == 1
      changed_when: true
    - name: Enable the persistent firewalld port rule
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --add-port
          - '{{ node_exporter_port }}/tcp'
      when:
        - ansible_facts.os_family == 'RedHat'
        - '''firewalld.service'' in ansible_facts.services'
        - (ansible_facts.services['firewalld.service'].state | default('stopped')) == 'running'
        - node_exporter_manage_firewall | bool
        - firewall_persistent.rc == 1
      changed_when: true
    - name: Flush handlers before verifying
      ansible.builtin.meta: flush_handlers
    - name: Confirm the exporter answers locally
      become: false
      changed_when: false
      ansible.builtin.uri:
        url: http://{{ node_exporter_probe_host }}:{{ node_exporter_port }}/metrics
        return_content: false
        status_code: 200
      retries: 6
      delay: 5
      until: exporter_probe is succeeded
      register: exporter_probe
    - name: Read the running exporter version
      become: false
      changed_when: false
      ansible.builtin.shell:
        cmd: |-
          set -o pipefail
          curl -fsS -m 10 http://{{ node_exporter_probe_host }}:{{ node_exporter_port }}/metrics |
          sed -n 's/.*node_exporter_build_info{.*version="\([^"]*\)".*/\1/p'
        executable: /bin/bash
      register: version_probe
    - name: Record the running exporter version
      ansible.builtin.set_fact:
        reported_version: '{{ version_probe.stdout | trim | default(''unknown'', true) }}'
    - name: Confirm the reported version matches the pinned fleet version
      ansible.builtin.assert:
        that:
          - reported_version == node_exporter_version
        fail_msg: '{{ inventory_hostname }} reports node_exporter {{ reported_version }}, expected {{ node_exporter_version
          }}.'
        quiet: true
    - name: Report the per-host result
      ansible.builtin.debug:
        msg: '{{ inventory_hostname }}: os={{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} method={{
          install_method }} version={{ reported_version }} listen={{ node_exporter_listen_address }}'
  handlers:
    - name: Restart the upstream exporter
      ansible.builtin.systemd_service:
        name: node_exporter
        state: restarted
        daemon_reload: true
    - name: Restart the Debian exporter
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        state: restarted
