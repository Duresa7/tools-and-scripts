# Strict KEY=value file. Values are literal; shell expansion is not evaluated.

# CUSTOMIZE: Set the proxmoxlib.js path. The packaged path is the same on Proxmox VE and Proxmox Backup Server.
TOOLKIT_FILE=/usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
# CUSTOMIZE: Set the package that owns the file. It's used only to report a version.
TOOLKIT_PACKAGE=proxmox-widget-toolkit
# CUSTOMIZE: Set the web proxy service: pveproxy on Proxmox VE, proxmox-backup-proxy on Proxmox Backup Server.
SERVICE_NAME=pveproxy
# CUSTOMIZE: Choose yes to restart the service after a change, or no to restart it yourself.
RESTART_SERVICE=yes
