[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
# Repository tests, then every tool's own tests (category/tool/tests).
testpaths = ["tests", "*/*/tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
