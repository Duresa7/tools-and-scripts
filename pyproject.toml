[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
  "tests",
  "linux/networkmanager-cutover/tests",
  "monitoring/prometheus-target-check/tests",
  "automation/semaphore-sqlite-guard/tests",
  "automation/teamspeak-channel-migration/tests",
  "automation/ssh-key-rotation/tests",
  "linux/proxmox-subscription-notice/tests",
  "linux/compose-service-update/tests",
  "monitoring/dnf-updates/tests",
  "monitoring/cloudflared-tunnel-health/tests",
  "monitoring/teamspeak-voice-probe/tests",
  "monitoring/minecraft-status-probe/tests",
  "monitoring/grafana-dashboard-check/tests",
  "utilities/tcp-reachability-check/tests",
  "automation/semaphore-project-reconciler/tests",
  "monitoring/unifi-flow-collector/tests",
  "windows/online-logon-policy/tests",
  "windows/workstation-bootstrap/tests",
  "windows/recovery-lockdown/tests",
  "windows/session-limits/tests",
  "utilities/git-preview-server/tests",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
